# FiloMiner - FiloPow (FPOW, KawPow) on the official pool
# pool.filopow.xyz: port 3333 = start difficulty 0.1, port 4444 = difficulty 1
# fee 1 %, PROP, payout every 10 min, minimum 1 FPOW
pool = stratum+tcp://pool.filopow.xyz:3333
# FPOW address (starts with F) . rig name
user = YOUR_FPOW_ADDRESS.rig1
pass = x
# GPUs: all, or a list like 0,1 (PCI bus order, as nvidia-smi)
gpus = all
# threads per block (multiple of 32) and blocks per launch (0 = automatic)
# tpb = 256
# grid = 0
# duration of one GPU launch in ms (automatic grid)
# target-ms = 150
# summary line every N seconds (the guard service watches these lines)
stats = 30
