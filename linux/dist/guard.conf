# /etc/filominer/guard.conf - FiloMiner services (read by gpu-prep.sh and filominer-guard.sh)
# Optional power limit for every NVIDIA GPU before each miner start, in watts.
# 0 = do not touch: the cards keep their own settings.
POWER_LIMIT=0
# No miner summary line ("MH/s total") for this many minutes while the service runs = stall.
STALL_MIN=10
# After a stall: GPU still answering -> restart the service; GPU lost (fallen off the bus,
# nvidia-smi failing) or still stalled after a restart -> reboot the machine.
MAX_REBOOTS=3          # at most this many guard reboots ...
REBOOT_WINDOW_H=6      # ... in this many hours
GRACE_MIN=5            # nothing is done during the first minutes after boot
